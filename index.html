<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>三韓詩龜鑑(삼한시귀감) 에서 (2) - 고려 한시 정선 웹 도록</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;400;600;700;900&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-primary: #fcfbf7;
      --bg-card: #ffffff;
      --bg-subtle: #f5f2e9;
      --text-main: #2b2b2b;
      --text-muted: #6b665f;
      --accent: #8b322c; /* 은은한 주묵(朱墨)색 */
      --accent-light: #fbeee9;
      --accent-gold: #b38234;
      --border-color: #e5ded3;
      --hanja-font: 'Noto Serif KR', serif;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
      --card-radius: 12px;
    }

    [data-theme="dark"] {
      --bg-primary: #18191c;
      --bg-card: #222327;
      --bg-subtle: #2b2c32;
      --text-main: #e6e4dc;
      --text-muted: #a39f96;
      --accent: #d96b5a;
      --accent-light: #362524;
      --accent-gold: #d4a753;
      --border-color: #383940;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }

    [data-theme="hanji"] {
      --bg-primary: #f4ede1;
      --bg-card: #faf6ee;
      --bg-subtle: #eae1d1;
      --text-main: #282420;
      --text-muted: #5e574f;
      --accent: #782d27;
      --accent-light: #ece0d6;
      --accent-gold: #966b26;
      --border-color: #d8cbbb;
      --shadow: 0 4px 16px rgba(90, 70, 50, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      line-height: 1.65;
      transition: background-color 0.3s ease, color 0.3s ease;
      min-height: 100vh;
    }

    /* 상단 헤더 */
    header {
      background-color: var(--bg-card);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow);
    }

    .header-inner {
      max-width: 1240px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
    }

    .brand-title {
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
    }

    .brand-title h1 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      letter-spacing: -0.02em;
    }

    .brand-title .badge {
      display: inline-block;
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      background: var(--accent-light);
      color: var(--accent);
      border-radius: 999px;
      font-weight: 600;
    }

    .subtitle-text {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    /* 컨트롤 툴바 */
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 0.75rem;
    }

    .search-box {
      position: relative;
    }

    .search-box input {
      padding: 0.45rem 0.9rem 0.45rem 2rem;
      border: 1px solid var(--border-color);
      border-radius: 20px;
      background-color: var(--bg-subtle);
      color: var(--text-main);
      font-size: 0.88rem;
      outline: none;
      width: 180px;
      transition: all 0.2s;
    }

    .search-box input:focus {
      width: 230px;
      border-color: var(--accent);
      background-color: var(--bg-card);
    }

    .search-box svg {
      position: absolute;
      left: 0.7rem;
      top: 50%;
      transform: translateY(-50%);
      width: 14px;
      height: 14px;
      fill: var(--text-muted);
    }

    .toggle-group {
      display: flex;
      gap: 0.4rem;
      align-items: center;
      background: var(--bg-subtle);
      padding: 0.25rem 0.4rem;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .btn-toggle {
      border: none;
      background: transparent;
      padding: 0.35rem 0.7rem;
      font-size: 0.82rem;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
      font-weight: 500;
    }

    .btn-toggle.active {
      background: var(--bg-card);
      color: var(--accent);
      font-weight: 700;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
    }

    .theme-select {
      border: 1px solid var(--border-color);
      background: var(--bg-subtle);
      color: var(--text-main);
      padding: 0.35rem 0.6rem;
      border-radius: 6px;
      font-size: 0.82rem;
      cursor: pointer;
      outline: none;
    }

    /* 메인 컨테이너 */
    .container {
      max-width: 1240px;
      margin: 1.5rem auto;
      padding: 0 1.5rem;
      display: grid;
      grid-template-columns: 260px 1fr;
      gap: 2rem;
      align-items: start;
    }

    /* 좌측 사이드바 네비게이션 */
    .sidebar {
      position: sticky;
      top: 5rem;
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 1.25rem;
      box-shadow: var(--shadow);
      max-height: calc(100vh - 6.5rem);
      overflow-y: auto;
    }

    .sidebar-section-title {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      font-weight: 700;
      margin-bottom: 0.75rem;
      padding-bottom: 0.3rem;
      border-bottom: 1px dashed var(--border-color);
    }

    .author-filter-list {
      list-style: none;
      margin-bottom: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .author-item {
      padding: 0.4rem 0.65rem;
      border-radius: 6px;
      font-size: 0.88rem;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: all 0.2s;
      color: var(--text-main);
    }

    .author-item:hover {
      background-color: var(--bg-subtle);
      color: var(--accent);
    }

    .author-item.active {
      background-color: var(--accent-light);
      color: var(--accent);
      font-weight: 700;
    }

    .author-count {
      font-size: 0.75rem;
      background-color: var(--bg-subtle);
      padding: 0.1rem 0.4rem;
      border-radius: 10px;
      color: var(--text-muted);
    }

    .toc-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.35rem;
      font-size: 0.84rem;
    }

    .toc-item a {
      color: var(--text-muted);
      text-decoration: none;
      display: block;
      padding: 0.3rem 0.5rem;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transition: 0.15s;
    }

    .toc-item a:hover {
      color: var(--accent);
      background: var(--bg-subtle);
    }

    .toc-item a:hover strong {
      color: var(--accent) !important;
    }

    /* 시 목록 메인 영역 */
    .poems-content {
      display: flex;
      flex-direction: column;
      gap: 2rem;
    }

    /* 인트로 카드 */
    .intro-banner {
      background: linear-gradient(135deg, var(--bg-card) 0%, var(--bg-subtle) 100%);
      border: 1px solid var(--border-color);
      border-left: 5px solid var(--accent);
      border-radius: var(--card-radius);
      padding: 1.5rem;
      box-shadow: var(--shadow);
    }

    .intro-banner h2 {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.3rem;
      color: var(--accent);
      margin-bottom: 0.6rem;
    }

    .intro-banner p {
      font-size: 0.92rem;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .stat-row {
      display: flex;
      gap: 1.5rem;
      margin-top: 1rem;
      font-size: 0.85rem;
      color: var(--text-main);
    }
    .stat-badge {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      padding: 0.3rem 0.8rem;
      border-radius: 20px;
      font-weight: 500;
    }
    .stat-badge strong {
      color: var(--accent);
    }

    /* 시 카드 */
    .poem-card {
      background-color: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--card-radius);
      padding: 2rem;
      box-shadow: var(--shadow);
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
    }

    .poem-card:hover {
      border-color: var(--accent-gold);
    }

    .poem-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 1.25rem;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 1rem;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .poem-title-box h3 {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-end;
      gap: 0.6rem;
      margin-bottom: 0.35rem;
    }

    .title-hanja-group {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.45rem;
      font-weight: 700;
      color: var(--accent);
      display: inline-flex;
      flex-wrap: wrap;
      align-items: flex-end;
      line-height: 1.4;
    }

    .title-char-box {
      margin-right: 0.15em;
    }

    .title-char-box .char-hanja {
      font-size: 1.45rem;
      color: var(--accent);
    }

    .title-char-box .char-sound {
      font-size: 0.72rem;
      font-weight: 600;
    }

    .title-char-box .char-hoon {
      font-size: 0.62rem;
      font-weight: 600;
    }

    .title-trans-sub {
      font-size: 1.05rem;
      font-weight: normal;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .poem-title-box .title-hanja {
      font-size: 1.25rem;
      color: var(--text-main);
      margin-left: 0.5rem;
    }

    .poem-title-box .poem-meta {
      font-size: 0.88rem;
      color: var(--text-muted);
      display: flex;
      gap: 0.8rem;
      align-items: center;
      margin-top: 0.25rem;
    }

    .poem-meta .author-tag {
      font-weight: 600;
      color: var(--accent-gold);
    }

    .poem-meta .form-tag {
      background: var(--bg-subtle);
      padding: 0.15rem 0.5rem;
      border-radius: 4px;
      font-size: 0.78rem;
    }

    .poem-actions {
      display: flex;
      gap: 0.5rem;
    }

    .btn-action {
      background: var(--bg-subtle);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 0.35rem 0.7rem;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      transition: 0.2s;
    }

    .btn-action:hover {
      background: var(--accent-light);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* 시 원문 & 번역 레이아웃 */
    .poem-body {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.8rem;
      margin-bottom: 1.5rem;
    }

    @media (max-width: 860px) {
      .poem-body {
        grid-template-columns: 1fr;
        gap: 1.2rem;
      }
    }

    /* 한자 원문 영역 */
    .poem-original {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.25rem;
      line-height: 2.2;
      color: var(--text-main);
      letter-spacing: 0.15em;
      background: var(--bg-subtle);
      padding: 1.25rem 1.5rem;
      border-radius: 8px;
      border-left: 3px solid var(--accent);
    }

    .line-group {
      margin-bottom: 0.3rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      transition: background-color 0.15s ease;
      cursor: pointer;
    }

    .line-group:hover, .line-group.highlight-paired {
      background-color: var(--accent-light);
    }

    .line-group.couplet-gap {
      margin-bottom: 0.85rem;
    }

    .char-box {
      display: inline-block;
      text-align: center;
      margin-right: 0.22em;
      position: relative;
      cursor: pointer;
      vertical-align: bottom;
      padding: 0 0.15em;
      border-radius: 4px;
      transition: background-color 0.15s;
    }

    .char-box:hover, .char-box:focus {
      background-color: rgba(139, 50, 44, 0.1);
      outline: none;
    }

    .char-hanja {
      display: block;
      font-weight: 600;
      line-height: 1.25;
    }

    .char-sound {
      display: block;
      font-size: 0.72rem;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--accent);
      line-height: 1.1;
      margin-top: 0.15rem;
      font-weight: 500;
    }

    .char-hoon {
      display: none;
      font-size: 0.62rem;
      font-family: 'Noto Sans KR', sans-serif;
      color: var(--accent-gold);
      line-height: 1.1;
      margin-top: 0.15rem;
      font-weight: 600;
      white-space: nowrap;
      letter-spacing: -0.05em;
    }

    /* 3단계 읽기 모드 제어 */
    body[data-char-mode="sound"] .char-sound { display: block; }
    body[data-char-mode="sound"] .char-hoon { display: none; }

    body[data-char-mode="hoon"] .char-sound { display: none; }
    body[data-char-mode="hoon"] .char-hoon { display: block; }

    body[data-char-mode="none"] .char-sound { display: none; }
    body[data-char-mode="none"] .char-hoon { display: none; }

    /* 개별 한자 호버 툴팁 */
    .char-tooltip {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(4px);
      background: #222327;
      color: #ffffff;
      padding: 0.35rem 0.65rem;
      border-radius: 6px;
      font-size: 0.78rem;
      font-family: 'Noto Sans KR', sans-serif;
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
      transition: all 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 150;
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.28);
      border: 1px solid rgba(255, 255, 255, 0.15);
      letter-spacing: normal;
    }

    .char-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border-width: 5px;
      border-style: solid;
      border-color: #222327 transparent transparent transparent;
    }

    .char-box:hover .char-tooltip,
    .char-box:focus .char-tooltip {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(-6px);
    }

    .tt-char {
      font-family: 'Noto Serif KR', serif;
      font-size: 1.15rem;
      font-weight: 700;
      color: #ffcf70;
      margin-right: 0.35rem;
    }

    .tt-desc {
      color: #f0ede6;
      font-weight: 500;
    }

    /* 한글 번역 영역 */
    .poem-translation {
      font-size: 0.98rem;
      line-height: 2.1;
      color: var(--text-main);
      padding: 1.25rem 1.5rem;
      background: var(--bg-subtle);
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .trans-line {
      margin-bottom: 0.3rem;
      padding: 0.15rem 0.4rem;
      border-radius: 4px;
      transition: background-color 0.15s ease;
      cursor: pointer;
    }

    .trans-line:hover, .trans-line.highlight-paired {
      background-color: var(--accent-light);
      color: var(--accent);
      font-weight: 500;
    }

    .trans-line.couplet-gap {
      margin-bottom: 0.85rem;
    }

    body.hide-translation .poem-translation {
      display: none;
    }

    body.hide-translation .poem-body {
      grid-template-columns: 1fr;
    }

    /* 주석 & 해설 박스 */
    .poem-details {
      margin-top: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .note-box {
      background: var(--bg-primary);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 1rem 1.25rem;
      font-size: 0.88rem;
    }

    .note-box-title {
      font-weight: 700;
      color: var(--accent-gold);
      margin-bottom: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-size: 0.9rem;
    }

    .note-list {
      list-style-type: none;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .note-item {
      display: flex;
      gap: 0.5rem;
    }

    .note-key {
      font-weight: 600;
      color: var(--accent);
      min-width: fit-content;
      font-family: 'Noto Serif KR', serif;
    }

    /* 토스트 알림 */
    .toast {
      position: fixed;
      bottom: 2rem;
      right: 2rem;
      background: var(--accent);
      color: #fff;
      padding: 0.75rem 1.25rem;
      border-radius: 8px;
      font-size: 0.88rem;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s;
      z-index: 1000;
      pointer-events: none;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    /* 반응형 */
    @media (max-width: 992px) {
      .container {
        grid-template-columns: 1fr;
      }
      .sidebar {
        position: static;
        max-height: none;
        margin-bottom: 1rem;
      }
      .toc-list {
        max-height: 200px;
        overflow-y: auto;
      }
    }

    /* 스마트폰 모바일 최적화 (640px 이하) */
    @media (max-width: 640px) {
      .header-inner {
        padding: 0.75rem 0.85rem;
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
      }

      .brand-title {
        justify-content: space-between;
      }

      .brand-title h1 {
        font-size: 1.25rem;
      }

      .brand-title .subtitle-text {
        display: none;
      }

      .controls {
        display: grid;
        grid-template-columns: 1fr;
        gap: 0.5rem;
      }

      .search-box {
        width: 100%;
      }

      .search-box input {
        width: 100% !important;
      }

      .controls-sub-row {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
        justify-content: space-between;
        align-items: center;
      }

      .container {
        padding: 0 0.6rem;
        margin: 0.75rem auto;
        gap: 1rem;
      }

      .intro-banner {
        padding: 1rem;
      }

      .intro-banner h2 {
        font-size: 1.15rem;
      }

      .stat-row {
        flex-wrap: wrap;
        gap: 0.5rem;
      }

      .poem-card {
        padding: 1.25rem 0.85rem;
        border-radius: 10px;
      }

      .poem-header {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.5rem;
      }

      .poem-title-box h3 {
        font-size: 1.2rem;
      }

      .poem-title-box .title-hanja {
        font-size: 1.05rem;
        display: block;
        margin-left: 0;
        margin-top: 0.15rem;
      }

      .poem-original {
        font-size: clamp(0.98rem, 4.3vw, 1.18rem);
        padding: 0.9rem 0.65rem;
        line-height: 2.1;
        letter-spacing: 0.05em;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }

      .poem-translation {
        padding: 0.9rem 0.85rem;
        font-size: 0.92rem;
        line-height: 1.85;
      }

      .char-box {
        margin-right: 0.08em;
        padding: 0 0.08em;
      }

      .char-sound {
        font-size: 0.64rem;
      }

      .char-hoon {
        font-size: 0.56rem;
        letter-spacing: -0.08em;
      }

      /* 모바일에서는 hover 툴팁 대신 하단 고정 팝업 바 사용 */
      .char-tooltip {
        display: none !important;
      }

      .sidebar {
        padding: 0.85rem;
      }

      .sidebar .author-filter-list {
        flex-direction: row;
        overflow-x: auto;
        padding-bottom: 0.5rem;
        white-space: nowrap;
        -webkit-overflow-scrolling: touch;
        gap: 0.4rem;
      }

      .sidebar .author-item {
        flex-shrink: 0;
        border: 1px solid var(--border-color);
        padding: 0.35rem 0.65rem;
        font-size: 0.82rem;
      }

      .sidebar .toc-list {
        max-height: 140px;
      }
    }

    // 작가별 목록 추출
    function getAuthors() {
      const authorsMap = new Map();
      poemsData.forEach(p => {
        const count = authorsMap.get(p.author) || 0;
        authorsMap.set(p.author, count + 1);
      });
      return authorsMap;
    }

    // 사이드바 작가 목록 렌더링
    function renderSidebar() {
      const authors = getAuthors();
      authorFilterList.innerHTML = `
        <li class="author-item ${currentAuthor === 'all' ? 'active' : ''}" data-author="all">
          <span>전체 시 보기</span>
          <span class="author-count">${poemsData.length}</span>
        </li>
      `;

      authors.forEach((count, author) => {
        const li = document.createElement("li");
        li.className = `author-item ${currentAuthor === author ? 'active' : ''}`;
        li.dataset.author = author;
        li.innerHTML = `
          <span>${author}</span>
          <span class="author-count">${count}</span>
        `;
        authorFilterList.appendChild(li);
      });

      // 클릭 이벤트
      document.querySelectorAll(".author-item").forEach(item => {
        item.addEventListener("click", () => {
          document.querySelectorAll(".author-item").forEach(i => i.classList.remove("active"));
          item.classList.add("active");
          currentAuthor = item.dataset.author;
          renderPoems();
          renderToc();
        });
      });
    }

    // 목차 (TOC) 렌더링: 제목(작자) 한자 원문 형태
    function renderToc() {
      tocList.innerHTML = "";
      const filtered = getFilteredPoems();
      filtered.forEach((p, idx) => {
        const titleHoonList = Array.from(p.titleHanja).filter(c => hanjaDict[c]).map(c => `${c}[${hanjaDict[c]}]`).join(' ');
        const tooltipText = `${p.titleHanja} (${p.title}) | ${titleHoonList} | 작가: ${p.author}`;
        const li = document.createElement("li");
        li.className = "toc-item";
        li.innerHTML = `<a href="#${p.id}" title="${tooltipText}"><span style="color:var(--accent); font-weight:600; margin-right:0.3rem;">${idx + 1}.</span><strong style="font-family:'Noto Serif KR',serif; font-size:0.92rem; color:var(--text-main);">${p.titleHanja}</strong> <span style="font-size:0.8rem; color:var(--text-muted);">(${p.authorHanja})</span></a>`;
        tocList.appendChild(li);
      });
    }

    // 필터링된 시 목록 반환
    function getFilteredPoems() {
      return poemsData.filter(p => {
        const matchAuthor = currentAuthor === "all" || p.author === currentAuthor;
        if (!matchAuthor) return false;

        if (!searchQuery.trim()) return true;

        const q = searchQuery.toLowerCase().trim();
        const titleMatch = p.title.toLowerCase().includes(q) || p.titleHanja.includes(q);
        const authorMatch = p.author.toLowerCase().includes(q) || p.authorHanja.includes(q);
        const linesMatch = p.lines ? p.lines.some(l => l.hanja.includes(q) || l.hangul.includes(q) || l.trans.toLowerCase().includes(q)) : false;
        const subMatch = p.subPoems ? p.subPoems.some(sp => sp.lines.some(l => l.hanja.includes(q) || l.hangul.includes(q) || l.trans.toLowerCase().includes(q))) : false;

        return titleMatch || authorMatch || linesMatch || subMatch;
      });
    }

    // 제목용 한자/훈음 박스 생성 (쉼표나 부호는 그대로 통과)
    function buildTitleCharBoxes(hanjaStr, soundStr) {
      let html = '';
      let soundIdx = 0;
      for (let i = 0; i < hanjaStr.length; i++) {
        const hj = hanjaStr[i];
        if (hj === ',' || hj === ' ' || hj === '、' || hj === '，') {
          html += `<span style="margin: 0 0.15rem; font-size:1.1rem; color:var(--text-muted);">${hj}</span>`;
          if (soundStr && (soundStr[soundIdx] === hj || soundStr[soundIdx] === ' ')) {
            soundIdx++;
          }
          continue;
        }
        const sound = (soundStr && soundStr[soundIdx]) ? soundStr[soundIdx] : '';
        soundIdx++;
        const hoon = hanjaDict[hj] || sound;
        html += `
          <span class="char-box title-char-box" tabindex="0" aria-label="${hj}: ${hoon}">
            <span class="char-hanja">${hj}</span>
            <span class="char-sound">${sound}</span>
            <span class="char-hoon">${hoon}</span>
            <span class="char-tooltip">
              <span class="tt-char">${hj}</span>
              <span class="tt-desc">${hoon}</span>
            </span>
          </span>
        `;
      }
      return html;
    }

    function buildCharBoxes(hanjaStr, hangulStr) {
      let html = '';
      for (let i = 0; i < hanjaStr.length; i++) {
        const hj = hanjaStr[i];
        const sound = (hangulStr && hangulStr[i]) ? hangulStr[i] : '';
        const hoon = hanjaDict[hj] || sound;
        html += `
          <span class="char-box" tabindex="0" aria-label="${hj}: ${hoon}">
            <span class="char-hanja">${hj}</span>
            <span class="char-sound">${sound}</span>
            <span class="char-hoon">${hoon}</span>
            <span class="char-tooltip">
              <span class="tt-char">${hj}</span>
              <span class="tt-desc">${hoon}</span>
            </span>
          </span>
        `;
      }
      return html;
    }

    // 시 카드 렌더링
    function renderPoems() {
      const filtered = getFilteredPoems();
      if (filtered.length === 0) {
        poemContainer.innerHTML = `
          <div style="text-align:center; padding: 4rem; color: var(--text-muted);">
            <p style="font-size: 1.1rem; margin-bottom: 0.5rem;">검색 결과가 없습니다.</p>
            <p style="font-size: 0.9rem;">검색어를 변경하거나 다른 작가를 선택해 보세요.</p>
          </div>
        `;
        return;
      }

      poemContainer.innerHTML = filtered.map(p => {
        // 복사용 텍스트 준비
        let copyText = `[${p.titleHanja} (${p.title})] - ${p.author}\n\n`;
        if (p.lines) {
          copyText += p.lines.map(l => `${l.hanja} (${l.hangul})\n${l.trans}`).join('\n\n');
        } else if (p.subPoems) {
          copyText += p.subPoems.map(sp => `${sp.subTitle}\n` + sp.lines.map(l => `${l.hanja} (${l.hangul})\n${l.trans}`).join('\n')).join('\n\n');
        }

        // 일반 시 본문 렌더링
        let bodyHtml = '';
        if (p.lines) {
          const originalLines = p.lines.map((l, idx) => {
            const isCoupletGap = (p.lines.length === 4 && idx === 1) || 
                                 (p.lines.length === 8 && idx % 2 === 1 && idx < 7) ||
                                 (p.lines.length > 8 && idx % 2 === 1);
            return `<div class="line-group ${isCoupletGap ? 'couplet-gap' : ''}" data-idx="${idx}">${buildCharBoxes(l.hanja, l.hangul)}</div>`;
          }).join('');

          const transLines = p.lines.map((l, idx) => {
            const isCoupletGap = (p.lines.length === 4 && idx === 1) || 
                                 (p.lines.length === 8 && idx % 2 === 1 && idx < 7) ||
                                 (p.lines.length > 8 && idx % 2 === 1);
            return `<div class="trans-line ${isCoupletGap ? 'couplet-gap' : ''}" data-idx="${idx}">${l.trans}</div>`;
          }).join('');

          bodyHtml = `
            <div class="poem-body">
              <div class="poem-original">${originalLines}</div>
              <div class="poem-translation">${transLines}</div>
            </div>
          `;
        } else if (p.subPoems) {
          // 북산잡제처럼 연작이 묶인 경우
          bodyHtml = p.subPoems.map((sp, spIdx) => {
            const origLines = sp.lines.map((l, idx) => `
              <div class="line-group ${idx === 1 ? 'couplet-gap' : ''}" data-idx="sub-${spIdx}-${idx}">${buildCharBoxes(l.hanja, l.hangul)}</div>
            `).join('');

            const trLines = sp.lines.map((l, idx) => `
              <div class="trans-line ${idx === 1 ? 'couplet-gap' : ''}" data-idx="sub-${spIdx}-${idx}">${l.trans}</div>
            `).join('');

            return `
              <div style="margin-bottom: 1.5rem;">
                <h4 style="font-family:'Noto Serif KR'; color:var(--accent-gold); margin-bottom:0.6rem; font-size:1.05rem;">${sp.subTitle}</h4>
                <div class="poem-body">
                  <div class="poem-original">${origLines}</div>
                  <div class="poem-translation">${trLines}</div>
                </div>
              </div>
            `;
          }).join('');
        }

        // 주석 렌더링
        let notesHtml = '';
        if (p.notes && p.notes.length > 0) {
          notesHtml = `
            <div class="note-box">
              <div class="note-box-title">
                <svg style="width:16px;height:16px;fill:currentColor;" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                시어 풀이 및 고사(故事)
              </div>
              <ul class="note-list">
                ${p.notes.map(n => `<li class="note-item"><span class="note-key">${n.key} :</span> <span>${n.desc}</span></li>`).join('')}
              </ul>
            </div>
          `;
        }

        return `
          <article class="poem-card" id="${p.id}">
            <div class="poem-header">
              <div class="poem-title-box">
                <h3>
                  <div class="title-hanja-group">${buildTitleCharBoxes(p.titleHanja, p.titleSound || '')}</div>
                  <span class="title-trans-sub">(${p.title})</span>
                </h3>
                <div class="poem-meta">
                  <span class="author-tag">${p.author}</span>
                  <span class="form-tag">${p.form}</span>
                  <span class="form-tag">${p.page}</span>
                </div>
              </div>
              <div class="poem-actions">
                <button class="btn-action btn-copy" data-copy="${encodeURIComponent(copyText)}" title="시 원문 및 번역 복사">
                  <svg style="width:14px;height:14px;fill:currentColor;" viewBox="0 0 24 24"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg>
                  복사
                </button>
              </div>
            </div>

            ${bodyHtml}

            <div class="poem-details">
              ${notesHtml}
              ${p.commentary ? `
                <div class="note-box" style="border-left: 3px solid var(--accent-gold);">
                  <div class="note-box-title" style="color:var(--text-main);">
                    <svg style="width:16px;height:16px;fill:var(--accent);" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/></svg>
                    감상 및 해설
                  </div>
                  <p style="color:var(--text-muted); line-height:1.7;">${p.commentary}</p>
                </div>
              ` : ''}
            </div>
          </article>
        `;
      }).join('');

      // 복사 이벤트 연결
      document.querySelectorAll(".btn-copy").forEach(btn => {
        btn.addEventListener("click", () => {
          const text = decodeURIComponent(btn.dataset.copy);
          navigator.clipboard.writeText(text).then(() => {
            showToast();
          });
        });
      });

      // 구절 페어링 호버 이벤트 연결
      document.querySelectorAll(".line-group, .trans-line").forEach(el => {
        el.addEventListener("mouseenter", () => {
          const card = el.closest(".poem-card");
          const idx = el.dataset.idx;
          if (card && idx !== undefined) {
            card.querySelectorAll(`[data-idx="${idx}"]`).forEach(paired => {
              paired.classList.add("highlight-paired");
            });
          }
        });
        el.addEventListener("mouseleave", () => {
          const card = el.closest(".poem-card");
          const idx = el.dataset.idx;
          if (card && idx !== undefined) {
            card.querySelectorAll(`[data-idx="${idx}"]`).forEach(paired => {
              paired.classList.remove("highlight-paired");
            });
          }
        });
      });

      // 모바일 한자 터치 팝업 바 연동
      const mobileHanjaBar = document.getElementById("mobileHanjaBar");
      const mhbChar = document.getElementById("mhbChar");
      const mhbDesc = document.getElementById("mhbDesc");
      const mhbCloseBtn = document.getElementById("mhbCloseBtn");

      document.querySelectorAll(".char-box").forEach(box => {
        box.addEventListener("click", (e) => {
          e.stopPropagation();
          const hj = box.querySelector(".char-hanja")?.textContent || "";
          const hoon = box.querySelector(".char-hoon")?.textContent || "";
          const sound = box.querySelector(".char-sound")?.textContent || "";
          if (hj && mobileHanjaBar) {
            mhbChar.textContent = hj;
            mhbDesc.textContent = hoon || sound;
            mobileHanjaBar.classList.add("active");
          }
        });
      });

      if (mhbCloseBtn) {
        mhbCloseBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          mobileHanjaBar.classList.remove("active");
        });
      }

      document.addEventListener("click", (e) => {
        if (mobileHanjaBar && !e.target.closest("#mobileHanjaBar") && !e.target.closest(".char-box")) {
          mobileHanjaBar.classList.remove("active");
        }
      });
    }

    function showToast() {
      toast.classList.add("show");
      setTimeout(() => {
        toast.classList.remove("show");
      }, 2000);
    }

    // 검색 이벤트
    searchInput.addEventListener("input", (e) => {
      searchQuery = e.target.value;
      renderPoems();
      renderToc();
    });

    // 3단계 한자 읽기 모드 (음독 / 훈과 음 / 숨김)
    let currentCharMode = "sound";
    document.body.setAttribute("data-char-mode", "sound");

    const charModeGroup = document.getElementById("charModeGroup");
    if (charModeGroup) {
      charModeGroup.querySelectorAll("button").forEach(btn => {
        btn.addEventListener("click", () => {
          charModeGroup.querySelectorAll("button").forEach(b => b.classList.remove("active"));
          btn.classList.add("active");
          currentCharMode = btn.dataset.mode;
          document.body.setAttribute("data-char-mode", currentCharMode);
        });
      });
    }

    // 해석 토글
    toggleTransBtn.addEventListener("click", () => {
      showTrans = !showTrans;
      toggleTransBtn.classList.toggle("active", showTrans);
      document.body.classList.toggle("hide-translation", !showTrans);
    });

    // 글자 크기 조절
    let currentFontSize = 16;
    const fontIncBtn = document.getElementById("fontIncBtn");
    const fontDecBtn = document.getElementById("fontDecBtn");
    
    if (fontIncBtn && fontDecBtn) {
      fontIncBtn.addEventListener("click", () => {
        if (currentFontSize < 22) {
          currentFontSize += 1.5;
          document.documentElement.style.fontSize = currentFontSize + "px";
        }
      });
      fontDecBtn.addEventListener("click", () => {
        if (currentFontSize > 13) {
          currentFontSize -= 1.5;
          document.documentElement.style.fontSize = currentFontSize + "px";
        }
      });
    }

    // 테마 변경
    themeSelect.addEventListener("change", (e) => {
      const theme = e.target.value;
      if (theme === "light") {
        document.documentElement.removeAttribute("data-theme");
      } else {
        document.documentElement.setAttribute("data-theme", theme);
      }
    });

    // 초기화 실행
    renderSidebar();
    renderToc();
    renderPoems();
  </script>
</body>
</html>
